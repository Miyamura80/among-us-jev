name: Lint

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - '**'
    paths-ignore:
      - '.github/workflows/**'

jobs:
  lint:
    if: github.event_name == 'pull_request' || github.event.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Setup
        run: bun install
      - name: Run lint
        run: make lint
      - name: Run dead code check
        run: make deadcode
      - name: Run type check
        run: make typecheck
      - name: Run tech debt check
        run: make tech_debt
      - name: Run duplicate code check
        run: make duplicate_code
      - name: Run import boundary check
        run: make import_lint
      - name: Run markdown link check
        run: make lint_links
      - name: Run AI writing check
        run: make check_ai_writing
