name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Run CI checks
        run: make ci

      - name: Run tests
        run: make test

      - name: Build
        run: bun run build

      - name: Bundle runtime config
        # The config loader resolves global-config.yaml relative to the bundled
        # index.js (import.meta.dir), so the YAML must ship alongside it in dist/.
        run: cp src/config/global-config.yaml src/config/production-config.yaml dist/

      - name: Package build artifact
        run: tar -czf "bun-template-${GITHUB_REF_NAME}.tar.gz" -C dist .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: bun-template-*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
